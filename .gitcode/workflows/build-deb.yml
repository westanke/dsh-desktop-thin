name: 打薄壳 deb

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-amd64:
    name: amd64 deb
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          . /etc/os-release && echo "系统: $PRETTY_NAME  架构: $(uname -m)"
          command -v dpkg-deb || { echo "✖ 缺 dpkg-deb"; exit 1; }
          command -v node    || { echo "✖ 缺 node"; exit 1; }
          echo "node: $(node -v)"

      - name: 打包
        run: bash tools/build-deb.sh amd64

      - name: 校验产物
        run: |
          set -euo pipefail
          ls -lh release/
          dpkg-deb --info release/*.deb
          if dpkg-deb --contents release/*.deb | grep -qiE 'electron|node_modules|\.so$'; then
            echo "✖ 包内混入运行时"; exit 1
          fi
          echo "✅ 只含壳代码，无运行时"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: release/*.deb
