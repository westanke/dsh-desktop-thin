name: 打薄壳 deb

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

# AtomGit 是唯一提供原生 arm64 runner 的国内平台，
# 所以这里直接上矩阵：一次提交出双架构 deb。
jobs:
  build:
    name: ${{ matrix.arch }} deb
    # 注意：写成带引号的单个字符串，避免 ${{ }} 表达式破坏 YAML flow 序列解析
    runs-on: "ubuntu-latest,${{ matrix.arch }},small"
    strategy:
      fail_fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          . /etc/os-release && echo "系统: $PRETTY_NAME  架构: $(uname -m)"
          command -v dpkg-deb || { echo "✖ 缺 dpkg-deb"; exit 1; }
          command -v node    || { echo "✖ 缺 node（build-deb.sh 读它取版本号）"; exit 1; }
          echo "node: $(node -v)"

      - name: 打包 ${{ matrix.arch }}
        run: bash tools/build-deb.sh ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}

      - name: 校验产物
        run: |
          set -euo pipefail
          ls -lh release/
          dpkg-deb --info release/*.deb
          # 薄壳招牌：包里绝不能有 Electron/Node 运行时
          if dpkg-deb --contents release/*.deb | grep -qiE 'electron|node_modules|\.so$'; then
            echo "✖ 包内混入运行时，打包策略被破坏"; exit 1
          fi
          echo "✅ 只含壳代码，无运行时"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: release/*.deb
